<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GAME SHOP - Main Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-primary: #f97316; /* Neon Orange */
      --brand-secondary: #c2410c; /* Dark Orange */
      --brand-accent: #fdba74; /* Light Orange Glow */
      --bg-dark: #0a0a0a;
      --panel-bg: rgba(15, 15, 15, 0.85); /* خلفية زجاجية شفافة */
      --text-gray: #a1a1aa;
      --white: #ffffff;
    }

    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Cairo', sans-serif; 
      background-color: var(--bg-dark); 
      background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.9)), url('bg.jpg'); 
      background-size: cover; 
      background-position: center; 
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--white); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
    }
    
    .main-wrapper { 
      width: 92%; 
      max-width: 600px; 
      background: var(--panel-bg); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px; 
      padding: 30px 20px; 
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(249, 115, 22, 0.2); 
      border: 1px solid rgba(249, 115, 22, 0.3); 
      position: relative; 
      overflow: hidden; 
      text-align: center;
    }
    .main-wrapper::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--brand-primary), var(--brand-accent), var(--brand-primary)); }

    .header-section { margin-bottom: 25px; }
    .store-brand { font-family: 'Share Tech Mono', monospace; font-size: 42px; font-weight: 900; margin: 0; direction: ltr; color: var(--white); text-shadow: 0 0 15px rgba(249, 115, 22, 0.7), 2px 2px 0px var(--brand-secondary); letter-spacing: 2px;}
    .store-owner { font-size: 16px; color: var(--brand-accent); margin: 5px 0; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 8px rgba(253, 186, 116, 0.4);}
    .dynamic-msg { font-size: 14px; color: var(--text-gray); margin: 15px 0; font-weight: 700; height: 20px; background: rgba(0, 0, 0, 0.6); padding: 8px; border-radius: 8px; border: 1px dashed rgba(249, 115, 22, 0.3); direction: ltr;}

    .menu-container { display: flex; flex-direction: column; gap: 10px; }
    .fw-group-title { color: var(--brand-accent); font-size: 15px; font-weight: bold; margin: 15px 0 5px; border-bottom: 1px solid rgba(249, 115, 22, 0.3); padding-bottom: 5px;}
    
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;}
    
    .btn { 
      flex: 1 1 45%;
      background: rgba(0, 0, 0, 0.6); 
      color: var(--white); 
      border: 1px solid var(--brand-primary); 
      padding: 12px 10px; 
      font-size: 13px; 
      font-family: 'Cairo', sans-serif; 
      font-weight: bold; 
      border-radius: 8px; 
      cursor: pointer; 
      transition: all 0.3s ease; 
      text-decoration: none;
      display: inline-block;
      box-sizing: border-box;
    }
    .btn:hover { background: var(--brand-primary); color: #000; box-shadow: 0 0 15px rgba(249, 115, 22, 0.5); transform: translateY(-2px);}
    
    .btn-gold { border-color: #fbbf24; color: #fbbf24; }
    .btn-gold:hover { background: #fbbf24; color: #000; box-shadow: 0 0 15px rgba(251, 191, 36, 0.5); }

    .btn-special {
      background: linear-gradient(135deg, var(--brand-secondary), var(--brand-primary));
      border: none;
      color: #fff;
      padding: 15px;
      font-size: 16px;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
    }
    .btn-special:hover { opacity: 0.9; transform: scale(1.02); }

    .btn-social { background: #1e3a8a; border-color: #3b82f6; margin-top: 20px;}
    .btn-social:hover { background: #3b82f6; color: #fff;}

    .store-footer { text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 15px; margin-top: 20px;}
    .footer-name { font-weight: 900; color: var(--brand-accent); font-size: 15px; margin-bottom: 4px;}
    .phone { font-family: 'Share Tech Mono', monospace; font-size: 15px; color: #000; background: var(--brand-primary); padding: 3px 10px; border-radius: 4px; display: inline-block; direction: ltr; font-weight: bold;}
    
    a { text-decoration: none; display: flex; flex: 1 1 45%;}
    a .btn { width: 100%;}
  </style>
</head>
<body>

<script>
  // لمنع الرجوع للخلف بالمتصفح
  var histlength = history.length; 
  history.go(-histlength + 2);
</script>

<div class="main-wrapper" id="menu">
  <header class="header-section">
    <h1 class="store-brand">GAME SHOP</h1>
    <div class="store-owner">إدارة م/ محمود فتحي</div>
    <div class="dynamic-msg" id="msgs">اختر نظام جهازك للبدء</div>
  </header>

  <div class="menu-container">
    
    <!-- قسم 5.05 -->
    <div class="fw-group-title">Firmware 5.05</div>
    <div class="btn-row">
      <button class="btn btn-gold" onmouseover="showMsg('PS4 5.05 FW GoldHEN Host')" onmouseout="clearMsg()" onclick="location.replace('505goldhen/index.html')">GoldHEN 5.05</button>
      <button class="btn" onmouseover="showMsg('PS4 5.05 FW Host v2.5')" onmouseout="clearMsg()" onclick="location.replace('505/index.html')">Exploit v2.5 - 5.05</button>
    </div>

    <!-- قسم 6.72 -->
    <div class="fw-group-title">Firmware 6.72</div>
    <div class="btn-row">
      <a href="672goldhen/index.html"><button class="btn btn-gold" onmouseover="showMsg('PS4 6.72 FW GoldHEN Host')" onmouseout="clearMsg()">GoldHEN 6.72</button></a>
      <a href="672/index.html"><button class="btn" onmouseover="showMsg('PS4 6.72 FW Host v3.0')" onmouseout="clearMsg()">Exploit v3.0 - 6.72</button></a>
    </div>

    <!-- قسم 7.xx -->
    <div class="fw-group-title">Firmware 7.xx</div>
    <div class="btn-row">
      <a href="702/index.html"><button class="btn" onmouseover="showMsg('PS4 7.02 FW Host v1.4')" onmouseout="clearMsg()">Exploit v1.4 - 7.02</button></a>
      <a href="75x/index.html"><button class="btn" onmouseover="showMsg('PS4 7.50 - 7.55 FW Host v1.5')" onmouseout="clearMsg()">Exploit 7.50 - 7.55</button></a>
    </div>

    <!-- قسم 9.00 -->
    <div class="fw-group-title">Firmware 9.00 (WebKit)</div>
    <div class="btn-row">
      <a href="900goldhen/index.html"><button class="btn btn-gold" onmouseover="showMsg('PS4 9.00 FW GoldHEN Host')" onmouseout="clearMsg()">GoldHEN 9.00</button></a>
      <a href="900v3/index.html"><button class="btn" onmouseover="showMsg('PS4 9.00 FW Auto Exploit')" onmouseout="clearMsg()">Exploit 9.00 (تلقائي)</button></a>
      <a href="900v2/index.html"><button class="btn" onmouseover="showMsg('PS4 9.00 FW Manual Exploit')" onmouseout="clearMsg()">Exploit 9.00 (يدوي)</button></a>
    </div>

    <!-- الشامل والاستعادة -->
    <div class="fw-group-title">أدوات إضافية</div>
    <div class="btn-row">
      <a href="g2all/index.html"><button class="btn btn-special" onmouseover="showMsg('PS4 7.00 - 13.52 Universal Host')" onmouseout="clearMsg()" style="flex: 1 1 100%;">التعديلة الشاملة (7.00 - 13.52)</button></a>
      <button class="btn" onmouseover="showMsg('Restore Host to User Guide')" onmouseout="clearMsg()" onclick="location.replace('restore/index.html')" style="flex: 1 1 100%;">استعادة المضيف (Restore Host)</button>
    </div>

  </div>

  <footer class="store-footer">
    <div class="footer-name">للتواصل والدعم الفني</div>
    <div class="phone">📞 07714434273</div>
  </footer>
</div>

<script>
  const msgBox = document.getElementById("msgs");
  const defaultMsg = "اختر نظام جهازك للبدء";

  function showMsg(text) {
    msgBox.innerHTML = text;
    msgBox.style.color = "var(--brand-primary)";
  }

  function clearMsg() {
    msgBox.innerHTML = defaultMsg;
    msgBox.style.color = "var(--text-gray)";
  }
</script>
</body>
</html>
